```yaml
name: RaceDay API CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay.sln

      - name: Build solution
        run: dotnet build Part2/RaceDay.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Part2/RaceDay.sln --configuration Release --no-build
```


